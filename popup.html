<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT Bulk Delete</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="app">
    <!-- Top Header -->
    <header class="header">
      <div class="header-left">
        <span class="logo-dot"></span>
        <h1>Chats</h1>
        <span id="totalBadge" class="count-pill">0</span>
      </div>
      <div class="header-actions">
        <button id="refreshBtn" class="icon-btn" title="Refresh chat list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Search Bar -->
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
      <input id="searchInput" type="text" class="search-input" placeholder="Search your chats..." autocomplete="off" />
      <button id="clearSearchBtn" class="clear-search" style="display: none;" title="Clear search">✕</button>
    </div>

    <!-- Select All Toolbar (Claude-style) -->
    <div class="select-toolbar">
      <label class="select-all-label">
        <input id="selectAllCheckbox" type="checkbox" class="custom-checkbox" />
        <span>Select all</span>
      </label>
      <span id="selectedCountText" class="selected-count">0 selected</span>
    </div>

    <!-- Status / Progress Banner -->
    <div id="statusBanner" class="status-banner" style="display: none;">
      <div class="status-row">
        <span id="statusMessage"></span>
        <button id="stopJobBtn" class="btn-stop" style="display: none;">Stop</button>
      </div>
      <div id="progressBarWrap" class="progress-bar-wrap" style="display: none;">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <!-- Scrollable Chat List -->
    <main id="chatList" class="chat-list">
      <div class="empty-state">
        <div class="spinner"></div>
        <p>Loading your chats...</p>
      </div>
    </main>

    <!-- Inline Confirm Bar -->
    <div id="confirmBar" class="confirm-bar" style="display: none;">
      <span id="confirmText" class="confirm-text">Delete selected chats?</span>
      <div class="confirm-btns">
        <button id="confirmCancelBtn" class="btn btn-secondary btn-sm">Cancel</button>
        <button id="confirmYesBtn" class="btn btn-danger btn-sm">Yes, Delete</button>
      </div>
    </div>

    <!-- Sticky Bottom Action Bar -->
    <footer class="bottom-bar">
      <button id="archiveBtn" class="btn btn-secondary" disabled>
        Archive (<span id="archiveCount">0</span>)
      </button>
      <button id="deleteBtn" class="btn btn-danger" disabled>
        Delete (<span id="deleteCount">0</span>)
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
